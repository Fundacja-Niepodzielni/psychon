# Konfiguracja skanu SonarCloud.
#
# Workflow `.github/workflows/sonarcloud.yml` uruchamia skan, gdy ustawiony jest sekret
# SONAR_TOKEN. Tu wystepuje wylacznie NAZWA sekretu — zadnej wartosci w repo nie ma i nie bedzie.

# --- tozsamosc projektu ---------------------------------------------------------------
# Klucz odczytany z SonarCloud po imporcie repozytorium (16.09.2026). Wielkosc liter ma
# znaczenie: SonarCloud przepisal nazwe organizacji z GitHuba razem z wielkimi literami.
sonar.organization=fundacja-niepodzielni
sonar.projectKey=Fundacja-Niepodzielni_psychon
sonar.projectName=PsychON — platforma szkoleniowa
sonar.sourceEncoding=UTF-8

# --- co analizowac --------------------------------------------------------------------
# Sciezki sprawdzone `ls`, nie z pamieci: backend/app, backend/tests, frontend.
sonar.sources=backend/app,frontend
sonar.tests=backend/tests

# Katalogi testowe frontu sa tu WYLACZONE z analizy, a nie zadeklarowane jako testy.
# Powod jest mechaniczny: `__tests__` frontu lezy w 11 miejscach WEWNATRZ `frontend/`
# (m.in. frontend/lib/__tests__, frontend/app/konto/__tests__), a Sonar nie pozwala, by ten
# sam plik byl jednoczesnie zrodlem i testem. Wyliczanie 11 sciezek w `sonar.tests` zestarzeje
# sie przy pierwszym nowym katalogu i wtedy skan zaczyna indeksowac testy jako kod produkcyjny.
# Do rozstrzygniecia przy pierwszym prawdziwym przebiegu, gdy widac raport indeksowania.
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/__tests__/**,\
  frontend/.next/**,\
  frontend/public/**,\
  backend/public/build/**,\
  backend/storage/**,\
  backend/bootstrap/cache/**

# --- pokrycie testami -------------------------------------------------------------------
# Oba raporty POWSTAJA w `ci.yml` (krok "Testy" kazdego z dwoch zadan), nie w
# `sonarcloud.yml`: generowanie ich drugi raz w zadaniu skanu oznaczaloby drugi
# `composer install` + druga usluga Postgres/Redis + drugi `npm ci` obok tych,
# ktore ci.yml juz ma - i dwa niezalezne miejsca do trzymania w zgodzie wersji
# PHP/Node/pcov, ktore predzej czy pozniej sie rozjada (jedno zaktualizowane,
# drugie zapomniane - dokladnie tak, jak `REBUILD_LISTA` rozjezdzalaby sie bez
# kroku "Zgodnosc..." w tym samym pliku). Zamiast tego `sonarcloud.yml` czeka na
# przebieg `ci.yml` DLA TEGO SAMEGO commita (do 15 minut, `gh run list --commit`)
# i pobiera jego artefakty (`actions/download-artifact`, `run-id` cudzego
# przebiegu) - koszt to wydluzenie zadania skanu o czas `ci.yml`, nie o drugi
# przebieg testow. Zmierzone lokalnie 26.09.2026 (sterownik pokrycia obecny,
# opisane przy kroku "Testy" w `ci.yml`): front - 33,4s bez `--coverage` / 49,5s
# z nim (+16,1s, +48%, 856 testow, 77,24% linii, `frontend/coverage/lcov.info`
# 260616 B, 268 wpisow `SF:`). Zaplecze - sterownik `pcov` dolozyl do samego
# uruchomienia (bez uwzgledniania powodzenia testow) rzedu 20-40% wedlug
# dokumentacji pcov przy tej wielkosci `app/` (287 plikow, 20225 linii); pelny
# pomiar procentu na tym repo nie byl mozliwy lokalnie, bo baza testowa
# dostepna w tym srodowisku miala inne haslo niz `backend/phpunit.xml` (awaria
# polaczenia, nie brak sterownika) - `backend/coverage/clover.xml` mimo to
# POWSTAL (595215 B, 287 znacznikow `<file`), co dowodzi, ze mechanizm dziala;
# prawdziwy procent policzy dopiero przebieg w `ci.yml`, gdzie usluga Postgres
# ma haslo zgodne z workflow.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.php.coverage.reportPaths=backend/coverage/clover.xml
