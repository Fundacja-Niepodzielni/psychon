name: CI

on:
  # paths-ignore zamiast [skip ci] w commitach: znacznik na czubku pushu wylacza
  # przebieg po cichu, takze przy scaleniu, i nie widac tego w historii zadania.
  # Sciezka jest tu widoczna dla kazdego, kto czyta workflow.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  backend:
    name: Backend (lint + testy)
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: niepodzielni_test
          POSTGRES_USER: niepodzielni
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niepodzielni"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # pcntl jest wymagane przez testy wspolbieznosci (H03, H12, H13).
          # Bez niego nie sa pomijane po cichu, tylko czerwone - patrz
          # backend/tests/Concerns/RequiresProcessConcurrency.php
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
      - name: Zależności
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Konfiguracja testowa
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
      # Analiza statyczna. Poziom i wyjatki stoja w phpstan.neon,
      # a baseline zamraza 331 trafien zastanych - liczba zmierzona
      # i zgodna co do sztuki z suma pol `count:` w phpstan-baseline.neon.
      # Krok JEST blokujacy: baseline istnieje po to, zeby nowe trafienie bylo
      # czerwone od razu, a nie dopisywalo sie do stosu do przejrzenia kiedys.
      - name: Analiza statyczna (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      # `composer audit` jest POMIAREM, nie krokiem blokujacym.
      # Baza podatnosci zmienia sie po stronie serwera, wiec ten krok potrafi
      # zaczerwienic sie sam z siebie, bez zadnej zmiany w naszym kodzie - a bramka,
      # ktora pada od cudzego wpisu, uczy zespol omijac bramke. Wynik ma byc WIDOCZNY
      # (krok na pomaranczowo), nie schowany pod `|| true`.
      - name: Podatności zależności PHP (pomiar, nie blokada)
        run: composer audit --locked --format=plain
        continue-on-error: true
      - name: Testy
        run: php artisan test
        env:
          # Tylko topologia runnera. Zadanie biegnie na maszynie runnera, a nie
          # w kontenerze, wiec uslugi widac wylacznie pod 127.0.0.1 - etykieta
          # uslugi nie jest tu nazwa hosta. Cala reszta ustawien bazy pochodzi
          # z backend/phpunit.xml (wpisy wymuszone, przepisane do $_SERVER przez
          # backend/tests/bootstrap.php); wpisywanie ich takze tutaj bylo martwe
          # i mylace, bo czytelnik widzial wartosci, ktore niczego nie ustawiaja.
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Zależności
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testy
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      # `--omit=dev` swiadomie: zmierzone
      # 6 podatnosci lacznie, z tego 2 produkcyjne - cztery zdjete flaga siedza
      # w narzedziach (vitest, js-yaml), ktore nie ida do przegladarki uzytkownika.
      # `--audit-level=high` tak samo: nizsze progi zapelnilyby log szumem,
      # w ktorym krytyczna pozycja przestaje byc widoczna.
      # Pomiar, nie blokada - z tego samego powodu co przy composer audit.
      - name: Podatności zależności npm (pomiar, nie blokada)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  skaner-statyczny:
    name: Skaner statyczny (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.169.0
    steps:
      - uses: actions/checkout@v4
      # Reguly czytamy z KATALOGU W REPO, a nie z `--config p/...`. Powod jest
      # jeden: bramka, ktorej wynik zalezy od cudzego serwera i od tego, co ktos
      # wczoraj zmienil w regule, nie jest przyrzadem, tylko prognoza. Migawka
      # ma zapisane zrodlo, date i sumy sha256 w .semgrep/ZRODLO.md; jej
      # odswiezenie jest osobna zmiana z przegladem roznicy, nie automatem.
      # Przy okazji: `p/laravel` NIE ISTNIEJE (HTTP 404), a `p/nextjs` jest pusty
      # (`rules: []`) - zestaw pusty wchodzi na zielono i wyglada na dzialajacy
      # skaner, wiec 404 bylby tu mniejszym zlem. Nie dopisywac ich z powrotem.
      #
      # Krok NIE JEST jeszcze blokujacy. Na dzis skan daje 2 trafienia, oba
      # w jednej linii backend/config/session.php, oba na poziomie ERROR: jedno
      # falszywe (null = ciasteczko host-only, czyli wezsze), drugie do
      # rozstrzygniecia (domyslna wartosc flagi secure). Krok blokujacy, ktory
      # jest czerwony od pierwszego dnia, uczy zespol omijac bramke - a wyciszenie
      # ich tutaj schowaloby pytanie, ktore ma zostac zadane. Warunek przelaczenia
      # na blokujacy jest jeden i konkretny: gdy oba trafienia z session.php beda
      # rozstrzygniete, `continue-on-error` znika. Liczba trafien jest w logu.
      - name: Skan na przypietych regulach
        run: semgrep scan --config .semgrep/reguly --error --metrics=off
        continue-on-error: true
