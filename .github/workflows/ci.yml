name: CI

on:
  # paths-ignore zamiast [skip ci] w commitach: znacznik na czubku pushu wylacza
  # przebieg po cichu, takze przy scaleniu, i nie widac tego w historii zadania.
  # Sciezka jest tu widoczna dla kazdego, kto czyta workflow.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    # Kazda galaz, nie tylko main. Galaz w tym repo pojawia sie wylacznie przez push
    # lidera, wiec kazdy taki push ma prawo do wlasnego przebiegu; bez tego galezie
    # sprintu nie mialy zadnego biegu zdalnego (zmierzone 10.09: 0 przebiegow).
    # Repo jest publiczne, wiec minuty Actions sa poza pula organizacji.
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  backend:
    name: Backend (lint + testy)
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: niepodzielni_test
          POSTGRES_USER: niepodzielni
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niepodzielni"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 / 2.37.2
        with:
          php-version: "8.4"
          # pcntl jest wymagane przez testy wspolbieznosci (H03, H12, H13).
          # Bez niego nie sa pomijane po cichu, tylko czerwone - patrz
          # backend/tests/Concerns/RequiresProcessConcurrency.php
          extensions: pdo_pgsql, redis, pcntl
          # pcov, nie xdebug: lokalnie (kontener z ta sama wersja PHP i tymi
          # samymi testami) wygenerowal `backend/coverage/clover.xml` (287
          # znacznikow `<file`, 595215 B) - wlasnie dowod, ze mechanizm
          # dziala. Czystego pomiaru narzutu czasowego SAMEGO sterownika na
          # tym repo nie dalo sie zrobic lokalnie (baza testowa w tym
          # srodowisku miala inne haslo niz `backend/phpunit.xml`, wiec 902
          # testow padalo na polaczeniu, nie na asercji - patrz uzasadnienie
          # przy sciezkach raportow w sonar-project.properties). Xdebug w
          # trybie pokrycia jest ogolnie wolniejszy od pcov na tej samej
          # suicie (pcov liczy tylko linie wykonane, bez pelnego trace'u).
          coverage: pcov
      - name: Zależności
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Konfiguracja testowa
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
      # Analiza statyczna. Poziom i wyjatki stoja w phpstan.neon,
      # a baseline zamraza 331 trafien zastanych - liczba zmierzona
      # i zgodna co do sztuki z suma pol `count:` w phpstan-baseline.neon.
      # Krok JEST blokujacy: baseline istnieje po to, zeby nowe trafienie bylo
      # czerwone od razu, a nie dopisywalo sie do stosu do przejrzenia kiedys.
      - name: Analiza statyczna (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      # `composer audit` jest POMIAREM, nie krokiem blokujacym.
      # Baza podatnosci zmienia sie po stronie serwera, wiec ten krok potrafi
      # zaczerwienic sie sam z siebie, bez zadnej zmiany w naszym kodzie - a bramka,
      # ktora pada od cudzego wpisu, uczy zespol omijac bramke. Wynik ma byc WIDOCZNY
      # (krok na pomaranczowo), nie schowany pod `|| true`.
      - name: Podatności zależności PHP (pomiar, nie blokada)
        run: composer audit --locked --format=plain
        continue-on-error: true
      # Proba sprawdzen wstepnych `scripts/setup.sh --sprawdz`. Lezala w drzewie
      # bez zadnego wolajacego, wiec nie wykonala sie ani razu - a proba, ktorej
      # nikt nie uruchamia, nie pilnuje niczego. Dziala na atrapach narzedzi w
      # `PATH`, nie potrzebuje dockera ani sieci; biegnie z korzenia repozytorium,
      # bo tego wymaga jej wlasny sposob ustalania sciezek.
      - name: Sprawdzenia wstepne instalatora
        run: bash scripts/tests/setup-preflight.sh
        working-directory: ${{ github.workspace }}
      # Proba plikow samego potoku: czy skan jakosci moze pobiec bez raportow
      # pokrycia (zielone 0,0 % zamiast pomiaru) i czy oba przebiegi pomijaja te
      # same sciezki. Obie wady byly w drzewie naraz, obie dawaly wynik bez pomiaru.
      - name: Spojnosc przebiegu skanu
        run: bash deploy/tests/test-spojnosc-skanu.sh
        working-directory: ${{ github.workspace }}
      # Proba niedokonczona (`markTestIncomplete`) konczy sie domyslnie jako
      # przechodzaca i wchodzi do sumy "passed" - a wtedy lista sprawdzen swieci
      # na zielono, choc asercji nie przybylo ani jednej. Zmierzone dzis na tym
      # czubku: takich prob jest **0**, wiec flaga niczego nie czerwieni teraz,
      # tylko zamyka droge nastepnym. Pominiecia warunkowe (`markTestSkipped`,
      # np. brak `pcntl`) zostaja dozwolone - one MOWIA, czego nie zmierzono.
      # `--coverage-clover` idzie do phpunit wprost (Collision przepuszcza
      # nieznane sobie opcje) i wymaga sterownika ustawionego wyzej w kroku
      # `setup-php` (`coverage: pcov`) - bez niego ten sam krok konczy sie
      # bledem "No code coverage driver available", a nie cichym pominieciem.
      - name: Testy
        run: php artisan test --fail-on-incomplete --coverage-clover=coverage/clover.xml
        env:
          # Tylko topologia runnera. Zadanie biegnie na maszynie runnera, a nie
          # w kontenerze, wiec uslugi widac wylacznie pod 127.0.0.1 - etykieta
          # uslugi nie jest tu nazwa hosta. Cala reszta ustawien bazy pochodzi
          # z backend/phpunit.xml (wpisy wymuszone, przepisane do $_SERVER przez
          # backend/tests/bootstrap.php); wpisywanie ich takze tutaj bylo martwe
          # i mylace, bo czytelnik widzial wartosci, ktore niczego nie ustawiaja.
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      # Raport idzie do skanu SonarCloud, ktory biegnie w OSOBNYM workflow
      # (`.github/workflows/sonarcloud.yml`) po zakonczeniu tego zadania -
      # uzasadnienie wyboru (artefakt zamiast powtarzania calego srodowiska
      # testowego w workflow skanu) stoi w `sonar-project.properties`.
      - name: Raport pokrycia zaplecza (artefakt dla skanu)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pokrycie-backend
          path: backend/coverage/clover.xml
          retention-days: 1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # JEDYNE miejsce, w ktorym ta lista jest wpisana z reki. Krok "Zaleznosci"
      # i krok "Zgodnosc..." ponizej czytaja ja stad, nie maja wlasnej kopii -
      # zmiana pakietow do przebudowania wymaga zmiany TYLKO tej jednej linii.
      REBUILD_LISTA: "esbuild unrs-resolver fsevents"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `--ignore-scripts` blokuje dowolny kod z postinstall cudzych paczek (lancuch
      # dostaw). Nie jest slepe: `esbuild` i `unrs-resolver` maja "hasInstallScript"
      # w package-lock.json i ich postinstall tylko wybiera/pobiera wlasciwy natywny
      # plik binarny z wlasnych `optionalDependencies` - bez niego `npm run build`
      # (Vite/esbuild) i `npm run lint` (unrs-resolver) padaja. Dlatego po instalacji
      # jawnie odpalamy install-scripts wylacznie dla tych dwoch, zamiast ufac
      # kazdemu postinstallowi z osobna. `fsevents` (macOS-only, opcjonalny) jest
      # tu nieobecny na Linuksie, wiec rebuild jest dla niego pusty i nieszkodliwy.
      - name: Zależności
        run: |
          npm ci --ignore-scripts
          read -ra REBUILD_ARR <<< "$REBUILD_LISTA"
          npm rebuild "${REBUILD_ARR[@]}"
      # $REBUILD_LISTA jest zdefiniowana raz, w `env:` tego zadania (zobacz wyzej).
      # Ten krok nie ma wlasnej kopii listy - czyta dokladnie ta sama zmienna,
      # ktora krok "Zaleznosci" przekazuje do `npm rebuild`. Nic samo z siebie
      # nie pilnowaloby zgodnosci z polem "hasInstallScript" w package-lock.json,
      # gdyby zaleznosc z wlasnym postinstallem dolaczyla albo odpadla - ten krok
      # PRZERYWA bieg przy takim rozjezdzie, zamiast go tylko notowac.
      - name: Zgodność listy rebuildu z package-lock.json
        run: |
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const found = new Set();
            for (const [p, info] of Object.entries(lock.packages || {})) {
              if (info && info.hasInstallScript) found.add(p.split("node_modules/").pop());
            }
            const expected = new Set(
              (process.env.REBUILD_LISTA || "").trim().split(/\s+/).filter(Boolean)
            );
            const a = [...found].sort().join(",");
            const b = [...expected].sort().join(",");
            if (a !== b) {
              console.error("Rozjazd: hasInstallScript w package-lock.json = [" + a + "], REBUILD_LISTA = [" + b + "]. Uaktualnij zmienna REBUILD_LISTA w env: tego zadania.");
              process.exit(1);
            }
            console.log("Zgodnosc potwierdzona: " + a);
          '
      # Pole "libc" w package-lock.json: npm 10.9.8 potrafi
      # je zgubić na pakietach *-linux-*, a wtedy node:22-alpine instaluje
      # razem glibc i musla zamiast jednej odmiany. Krok jest blokujący
      # i nie potrzebuje `npm ci` - biegnie po samym pliku package-lock.json.
      - name: Pole libc w package-lock.json
        run: node scripts/check-lock-libc.mjs
      - name: Lint
        run: npm run lint
      # `--coverage.reporter=lcov` obok `text-summary`: lcov idzie do pliku dla
      # skanu, `text-summary` zostaje w logu, zeby procent byl widoczny bez
      # otwierania artefaktu. Provider `v8` jest juz w zaleznosciach rozwojowych
      # (`@vitest/coverage-v8`), wiec ten krok nie dotyka `package-lock.json`.
      - name: Testy
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      # Raport idzie do skanu SonarCloud, ktory biegnie w OSOBNYM workflow -
      # uzasadnienie stoi w `sonar-project.properties`.
      - name: Raport pokrycia frontu (artefakt dla skanu)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pokrycie-frontend
          path: frontend/coverage/lcov.info
          retention-days: 1
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      # `--omit=dev` swiadomie: zmierzone
      # 6 podatnosci lacznie, z tego 2 produkcyjne - cztery zdjete flaga siedza
      # w narzedziach (vitest, js-yaml), ktore nie ida do przegladarki uzytkownika.
      # `--audit-level=high` tak samo: nizsze progi zapelnilyby log szumem,
      # w ktorym krytyczna pozycja przestaje byc widoczna.
      # Pomiar, nie blokada - z tego samego powodu co przy composer audit.
      - name: Podatności zależności npm (pomiar, nie blokada)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  skaner-statyczny:
    name: Skaner statyczny (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.169.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Reguly czytamy z KATALOGU W REPO, a nie z `--config p/...`. Powod jest
      # jeden: bramka, ktorej wynik zalezy od cudzego serwera i od tego, co ktos
      # wczoraj zmienil w regule, nie jest przyrzadem, tylko prognoza. Migawka
      # ma zapisane zrodlo, date i sumy sha256 w .semgrep/ZRODLO.md; jej
      # odswiezenie jest osobna zmiana z przegladem roznicy, nie automatem.
      # Przy okazji: `p/laravel` NIE ISTNIEJE (HTTP 404), a `p/nextjs` jest pusty
      # (`rules: []`) - zestaw pusty wchodzi na zielono i wyglada na dzialajacy
      # skaner, wiec 404 bylby tu mniejszym zlem. Nie dopisywac ich z powrotem.
      #
      # Krok JEST blokujacy od 10.09. Warunek przelaczenia byl zapisany tutaj
      # wczesniej i zostal spelniony: oba zastane trafienia z backend/config/
      # session.php sa rozstrzygniete - jedno bylo falszywe (null = ciasteczko
      # host-only, czyli wezsze, nie szersze) i nosi wyciszenie z uzasadnieniem
      # przy linii, drugie bylo prawdziwe i flaga secure ma teraz bezpieczna
      # wartosc domyslna. Zmierzone na czubku przed przelaczeniem:
      # 31 regul na 439 plikach, 0 trafien.
      #
      # Migawka nie zawiera juz zestawu generic.secrets.*: jego reguly nosza
      # przyklady sekretow w `pattern-not:` i push protection GitHuba odrzucala
      # przez nie pchniecie (GH013). Sekrety skanuje gitleaks w bramce lokalnej
      # (krok 3e) oraz push protection - nie dopisywac ich tu z powrotem.
      - name: Skan na przypietych regulach
        run: semgrep scan --config .semgrep/reguly --error --metrics=off
