name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + testy)
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: niepodzielni_test
          POSTGRES_USER: niepodzielni
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niepodzielni"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # pcntl jest wymagane przez testy wspolbieznosci (H03, H12, H13).
          # Bez niego nie sa pomijane po cichu, tylko czerwone - patrz
          # backend/tests/Concerns/RequiresProcessConcurrency.php
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
      - name: Zależności
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Konfiguracja testowa
        run: |
          cp .env.example .env
          php artisan key:generate
        env: {}
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
      - name: Testy
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          # DB_DATABASE swiadomie nieustawione: baze testowa wyznacza backend/phpunit.xml
          # (wpis wymuszony), a backend/tests/bootstrap.php tworzy ja przy pierwszym
          # uruchomieniu. Wiersz "DB_DATABASE: niepodzielni_test" byl tu martwy - po
          # domknieciu pulapki P-1 wpis z phpunit.xml wygrywa, wiec zmienna tylko myli.
          DB_USERNAME: niepodzielni
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Zależności
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testy
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
