name: CI

on:
  # paths-ignore zamiast [skip ci] w commitach: znacznik na czubku pushu wylacza
  # przebieg po cichu, takze przy scaleniu, i nie widac tego w historii zadania.
  # Sciezka jest tu widoczna dla kazdego, kto czyta workflow.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    # Kazda galaz, nie tylko main. Galaz w tym repo pojawia sie wylacznie przez push
    # lidera, wiec kazdy taki push ma prawo do wlasnego przebiegu; bez tego galezie
    # sprintu nie mialy zadnego biegu zdalnego (zmierzone 10.09: 0 przebiegow).
    # Repo jest publiczne, wiec minuty Actions sa poza pula organizacji.
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  backend:
    name: Backend (lint + testy)
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: niepodzielni_test
          POSTGRES_USER: niepodzielni
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U niepodzielni"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 / 2.37.2
        with:
          php-version: "8.4"
          # pcntl jest wymagane przez testy wspolbieznosci (H03, H12, H13).
          # Bez niego nie sa pomijane po cichu, tylko czerwone - patrz
          # backend/tests/Concerns/RequiresProcessConcurrency.php
          extensions: pdo_pgsql, redis, pcntl
          # pcov, nie xdebug: lokalnie (kontener z ta sama wersja PHP i tymi
          # samymi testami) wygenerowal `backend/coverage/clover.xml` (287
          # znacznikow `<file`, 595215 B) - wlasnie dowod, ze mechanizm
          # dziala. Czystego pomiaru narzutu czasowego SAMEGO sterownika na
          # tym repo nie dalo sie zrobic lokalnie (baza testowa w tym
          # srodowisku miala inne haslo niz `backend/phpunit.xml`, wiec 902
          # testow padalo na polaczeniu, nie na asercji - patrz uzasadnienie
          # przy sciezkach raportow w sonar-project.properties). Xdebug w
          # trybie pokrycia jest ogolnie wolniejszy od pcov na tej samej
          # suicie (pcov liczy tylko linie wykonane, bez pelnego trace'u).
          coverage: pcov
      - name: Zależności
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Konfiguracja testowa
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test
      # Analiza statyczna. Poziom i wyjatki stoja w phpstan.neon,
      # a baseline zamraza 331 trafien zastanych - liczba zmierzona
      # i zgodna co do sztuki z suma pol `count:` w phpstan-baseline.neon.
      # Krok JEST blokujacy: baseline istnieje po to, zeby nowe trafienie bylo
      # czerwone od razu, a nie dopisywalo sie do stosu do przejrzenia kiedys.
      - name: Analiza statyczna (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress
      # `composer audit` jest POMIAREM, nie krokiem blokujacym.
      # Baza podatnosci zmienia sie po stronie serwera, wiec ten krok potrafi
      # zaczerwienic sie sam z siebie, bez zadnej zmiany w naszym kodzie - a bramka,
      # ktora pada od cudzego wpisu, uczy zespol omijac bramke. Wynik ma byc WIDOCZNY
      # (krok na pomaranczowo), nie schowany pod `|| true`.
      - name: Podatności zależności PHP (pomiar, nie blokada)
        run: composer audit --locked --format=plain
        continue-on-error: true
      # Proba sprawdzen wstepnych `scripts/setup.sh --sprawdz`. Lezala w drzewie
      # bez zadnego wolajacego, wiec nie wykonala sie ani razu - a proba, ktorej
      # nikt nie uruchamia, nie pilnuje niczego. Dziala na atrapach narzedzi w
      # `PATH`, nie potrzebuje dockera ani sieci; biegnie z korzenia repozytorium,
      # bo tego wymaga jej wlasny sposob ustalania sciezek.
      - name: Sprawdzenia wstepne instalatora
        run: bash scripts/tests/setup-preflight.sh
        working-directory: ${{ github.workspace }}
      # Proba plikow samego potoku: czy skan jakosci moze pobiec bez raportow
      # pokrycia (zielone 0,0 % zamiast pomiaru) i czy oba przebiegi pomijaja te
      # same sciezki. Obie wady byly w drzewie naraz, obie dawaly wynik bez pomiaru.
      - name: Spojnosc przebiegu skanu
        run: bash deploy/tests/test-spojnosc-skanu.sh
        working-directory: ${{ github.workspace }}
      # Proba niedokonczona (`markTestIncomplete`) konczy sie domyslnie jako
      # przechodzaca i wchodzi do sumy "passed" - a wtedy lista sprawdzen swieci
      # na zielono, choc asercji nie przybylo ani jednej. Zmierzone dzis na tym
      # czubku: takich prob jest **0**, wiec flaga niczego nie czerwieni teraz,
      # tylko zamyka droge nastepnym. Pominiecia warunkowe (`markTestSkipped`,
      # np. brak `pcntl`) zostaja dozwolone - one MOWIA, czego nie zmierzono.
      # `--coverage-clover` idzie do phpunit wprost (Collision przepuszcza
      # nieznane sobie opcje) i wymaga sterownika ustawionego wyzej w kroku
      # `setup-php` (`coverage: pcov`) - bez niego ten sam krok konczy sie
      # bledem "No code coverage driver available", a nie cichym pominieciem.
      - name: Testy
        run: php artisan test --fail-on-incomplete --coverage-clover=coverage/clover.xml
        env:
          # Tylko topologia runnera. Zadanie biegnie na maszynie runnera, a nie
          # w kontenerze, wiec uslugi widac wylacznie pod 127.0.0.1 - etykieta
          # uslugi nie jest tu nazwa hosta. Cala reszta ustawien bazy pochodzi
          # z backend/phpunit.xml (wpisy wymuszone, przepisane do $_SERVER przez
          # backend/tests/bootstrap.php); wpisywanie ich takze tutaj bylo martwe
          # i mylace, bo czytelnik widzial wartosci, ktore niczego nie ustawiaja.
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      # Raport idzie do skanu SonarCloud, ktory biegnie w OSOBNYM workflow
      # (`.github/workflows/sonarcloud.yml`) po zakonczeniu tego zadania -
      # uzasadnienie wyboru (artefakt zamiast powtarzania calego srodowiska
      # testowego w workflow skanu) stoi w `sonar-project.properties`.
      - name: Raport pokrycia zaplecza (artefakt dla skanu)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pokrycie-backend
          path: backend/coverage/clover.xml
          retention-days: 1

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # JEDYNE miejsce, w ktorym ta lista jest wpisana z reki. Krok "Zaleznosci"
      # i krok "Zgodnosc..." ponizej czytaja ja stad, nie maja wlasnej kopii -
      # zmiana pakietow do przebudowania wymaga zmiany TYLKO tej jednej linii.
      REBUILD_LISTA: "esbuild unrs-resolver fsevents"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `--ignore-scripts` blokuje dowolny kod z postinstall cudzych paczek (lancuch
      # dostaw). Nie jest slepe: `esbuild` i `unrs-resolver` maja "hasInstallScript"
      # w package-lock.json i ich postinstall tylko wybiera/pobiera wlasciwy natywny
      # plik binarny z wlasnych `optionalDependencies` - bez niego `npm run build`
      # (Vite/esbuild) i `npm run lint` (unrs-resolver) padaja. Dlatego po instalacji
      # jawnie odpalamy install-scripts wylacznie dla tych dwoch, zamiast ufac
      # kazdemu postinstallowi z osobna. `fsevents` (macOS-only, opcjonalny) jest
      # tu nieobecny na Linuksie, wiec rebuild jest dla niego pusty i nieszkodliwy.
      - name: Zależności
        run: |
          npm ci --ignore-scripts
          read -ra REBUILD_ARR <<< "$REBUILD_LISTA"
          npm rebuild "${REBUILD_ARR[@]}"
      # $REBUILD_LISTA jest zdefiniowana raz, w `env:` tego zadania (zobacz wyzej).
      # Ten krok nie ma wlasnej kopii listy - czyta dokladnie ta sama zmienna,
      # ktora krok "Zaleznosci" przekazuje do `npm rebuild`. Nic samo z siebie
      # nie pilnowaloby zgodnosci z polem "hasInstallScript" w package-lock.json,
      # gdyby zaleznosc z wlasnym postinstallem dolaczyla albo odpadla - ten krok
      # PRZERYWA bieg przy takim rozjezdzie, zamiast go tylko notowac.
      - name: Zgodność listy rebuildu z package-lock.json
        run: |
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const found = new Set();
            for (const [p, info] of Object.entries(lock.packages || {})) {
              if (info && info.hasInstallScript) found.add(p.split("node_modules/").pop());
            }
            const expected = new Set(
              (process.env.REBUILD_LISTA || "").trim().split(/\s+/).filter(Boolean)
            );
            const a = [...found].sort().join(",");
            const b = [...expected].sort().join(",");
            if (a !== b) {
              console.error("Rozjazd: hasInstallScript w package-lock.json = [" + a + "], REBUILD_LISTA = [" + b + "]. Uaktualnij zmienna REBUILD_LISTA w env: tego zadania.");
              process.exit(1);
            }
            console.log("Zgodnosc potwierdzona: " + a);
          '
      # Pole "libc" w package-lock.json: npm 10.9.8 potrafi
      # je zgubić na pakietach *-linux-*, a wtedy node:22-alpine instaluje
      # razem glibc i musla zamiast jednej odmiany. Krok jest blokujący
      # i nie potrzebuje `npm ci` - biegnie po samym pliku package-lock.json.
      - name: Pole libc w package-lock.json
        run: node scripts/check-lock-libc.mjs
      - name: Lint
        run: npm run lint
      # `--coverage.reporter=lcov` obok `text-summary`: lcov idzie do pliku dla
      # skanu, `text-summary` zostaje w logu, zeby procent byl widoczny bez
      # otwierania artefaktu. Provider `v8` jest juz w zaleznosciach rozwojowych
      # (`@vitest/coverage-v8`), wiec ten krok nie dotyka `package-lock.json`.
      - name: Testy
        run: npm test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      # Raport idzie do skanu SonarCloud, ktory biegnie w OSOBNYM workflow -
      # uzasadnienie stoi w `sonar-project.properties`.
      - name: Raport pokrycia frontu (artefakt dla skanu)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pokrycie-frontend
          path: frontend/coverage/lcov.info
          retention-days: 1
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      # Wolajacy: zestaw e2e (Playwright + axe-core) mierzy kontrast w
      # prawdziwej przegladarce - w jsdom (krok "Testy" wyzej) reguła
      # `color-contrast` zawsze konczy na "incomplete", nigdy na naruszeniu
      # (patrz `components/__tests__/axe-helper.ts`). Krok JEST blokujacy:
      # bez `continue-on-error`, bez `|| true`. Serwer nie stoi nigdzie w
      # tym zadaniu, wiec `PW_WEB_SERVER=1` (patrz `playwright.config.ts`)
      # stawia zbudowana wyzej aplikacje lokalnie (`npm run start`) i dopiero
      # na niej odpala testy - `AUTH_SECRET` to placeholder wylacznie na czas
      # tego efemerycznego przebiegu (Auth.js zglasza `MissingSecret` bez
      # niego przy proba odczytu sesji), nie sekret produkcyjny.
      - name: Instalacja przegladarki Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (axe-core, w tym kontrast kolorow)
        run: npm run e2e -- e2e/public-a11y.spec.ts
        env:
          PW_WEB_SERVER: "1"
          AUTH_SECRET: ci-only-placeholder-not-a-secret
          AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/niepodzielni
      # Wolajacy scripts/uruchom-pomiar-celow-dotyku.mjs: buduje statyczny
      # poligon atomow, stawia go lokalnym serwerem podgladu (vite preview,
      # port z PORT_POLIGONU - tutaj nieustawiony, wiec domyslne 4173) i
      # mierza realne prostokaty elementow klikalnych wobec progu 44px (patrz
      # design-system/poligon/pomiar-celow-dotyku.mjs). Krok JEST blokujacy:
      # kazdy kod rozny od zera (3 = zmierzone naruszenie, 2 = NIE ZMIERZONO -
      # zajety port, nieudany build poligonu albo serwer bez odpowiedzi w
      # 20s, albo dowolny inny kod spoza {0,2,3}) jest czerwony tutaj, zeby
      # awaria startu nie przechodzila w ciszy pod pozorem braku naruszen.
      # Przegladarke instaluje krok wyzej.
      - name: Pomiar celow dotyku (prog 44px)
        run: npm run pomiar:cele-dotyku
      # Wolajacy: JEDEN krok, dwa przyrzady - krok wolajacy pomiar stylu
      # nowego frontu (pomiar:styl-atomow) i sprawdzanie typow (sprawdz-typy)
      # wchodzi jednym wywolaniem, ze swiadkiem na poziomie calego przeplywu,
      # i zastepuje dwa osobne kroki sprzed tej zmiany. Przed
      # tym krokiem przyrzad pomiar:styl-atomow istnial tylko jako definicja w
      # package.json - zero wywolan w calym repozytorium. Krok JEST
      # blokujacy: bez `continue-on-error`, bez `if:`, ktore go ominie - kod
      # kazdej komendy jest czytany wprost z `$?` zaraz po niej (patrz nizej),
      # wiec krok nie polega na zachowaniu potoku (pipefail) przez powloke.
      # Przegladarke instaluje krok wyzej.
      #
      # pomiar:styl-atomow ma wlasny slad (scripts/uruchom-pomiar-stylu-atomow.mjs,
      # wzorzec "zmierzonych X z Y pozycji" w stdout przyrzadu): pusty albo
      # uszkodzony modul przyrzadu inaczej konczylby sie kodem 0 bez zmierzenia
      # niczego - wolajacy to lapie i oddaje kod 2 (NIE ZMIERZONO).
      #
      # sprawdz-typy NIE MIAL takiego sladu: `tsc --noEmit` przy sukcesie nie
      # wypisuje nic, wiec pusta albo zepsuta konfiguracja typow (np. pusty
      # "include" w tsconfig.json) konczylaby sie kodem 0 bez sprawdzenia choc
      # jednego pliku projektu - ten sam ksztalt wady, na drugim przyrzadzie.
      # To jest dodatkowe zabezpieczenie, ktorego samo WOLANIE sprawdz-typy
      # nie daje: przed wlasciwym sprawdzeniem ten krok liczy pliki PROJEKTU
      # (bez node_modules) w zasiegu tsconfig.json przez `--listFilesOnly` i
      # wymaga N > 0; N = 0 konczy caly krok kodem niezerowym WOLAJACEGO,
      # zanim jeszcze padnie wlasciwe `tsc --noEmit`.
      #
      # Kod przechwytywany JAWNIE (`set +e` / `$?` / `set -e`), nie przez
      # `if ! zmienna=$(polecenie)`: ten drugi wzorzec byl sprobowany lokalnie
      # i przekazywal dalej kod NEGACJI testu warunkowego (0/1), nie prawdziwy
      # kod wyjscia przyrzadu (np. 3 przy zmierzonym rozjezdzie w poligonie
      # zamienialo sie po drodze w 0) - stad ten, bardziej ostrozny, ksztalt.
      - name: Pomiar stylu atomow i sprawdzenie typow
        run: |
          set +e
          WYJSCIE_STYLU=$(npm run pomiar:styl-atomow 2>&1)
          KOD_STYLU=$?
          set -e
          echo "$WYJSCIE_STYLU"
          if [ "$KOD_STYLU" -ne 0 ]; then
            echo "WOLAJACY POMIARU STYLU ATOMOW: krok czerwony, kod $KOD_STYLU." >&2
            exit "$KOD_STYLU"
          fi
          if ! echo "$WYJSCIE_STYLU" | grep -Eq 'zmierzonych [0-9]+ z [1-9][0-9]* pozycji'; then
            echo "WOLAJACY POMIARU STYLU ATOMOW: NIE ZMIERZONO - brak wiersza \"zmierzonych X z N pozycji\" z N > 0 w wyjsciu (wpis przyrzadu pusty albo zepsuty)." >&2
            exit 1
          fi

          # DUBLURA CELOWA, NIE UPRASZCZAC: skrypt pomiaru juz sam konczy
          # sie kodem wyjscia 4, gdy pokrycie spadnie ponizej PROG_POKRYCIA (patrz
          # design-system/poligon/pomiar-styl-atomow.mjs, w. 572-575 - warunek
          # `pozycjeZmierzone.size < PROG_POKRYCIA`). Warunek ponizej NIE
          # czyta tamtego kodu wyjscia ani mu nie ufa - wylusk uje X z
          # WLASNEGO stdout ($WYJSCIE_STYLU, juz zebranego wyzej) i porownuje
          # je z PROG_POKRYCIA NIEZALEZNIE, tutaj, w workflow. Gdyby ktos
          # kiedys "uproscil" ten krok, licząc na to, ze KOD_STYLU!=0 wyzej
          # juz to zlapal - to zdejmuje jedyne zabezpieczenie, ktore nie
          # zalezy od tego, czy sam skrypt pomiaru nadal poprawnie liczy i
          # zwraca swoj kod wyjscia. Wolajacy ma nie wierzyc kodowi wyjscia
          # na slowo - to cala racja tej zmiany.
          PROG_POKRYCIA_PLIK="design-system/poligon/pomiar-styl-atomow.mjs"
          PROG_POKRYCIA_DUBLURA=$(grep -oE 'PROG_POKRYCIA = [0-9]+' "$PROG_POKRYCIA_PLIK" | head -1 | grep -oE '[0-9]+')
          if [ -z "$PROG_POKRYCIA_DUBLURA" ]; then
            echo "WOLAJACY POMIARU STYLU ATOMOW: NIE ZMIERZONO - nie udalo sie wyluskac PROG_POKRYCIA z $PROG_POKRYCIA_PLIK." >&2
            exit 1
          fi
          X_ZMIERZONYCH=$(echo "$WYJSCIE_STYLU" | grep -oE 'zmierzonych [0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "$X_ZMIERZONYCH" ]; then
            echo "WOLAJACY POMIARU STYLU ATOMOW: NIE ZMIERZONO - nie udalo sie wyluskac X z wiersza \"zmierzonych X z N pozycji\"." >&2
            exit 1
          fi
          echo "WOLAJACY POMIARU STYLU ATOMOW (dublura): zmierzonych $X_ZMIERZONYCH pozycji, PROG_POKRYCIA=$PROG_POKRYCIA_DUBLURA."
          if [ "$X_ZMIERZONYCH" -lt "$PROG_POKRYCIA_DUBLURA" ]; then
            echo "WOLAJACY POMIARU STYLU ATOMOW: krok czerwony (dublura) - zmierzonych $X_ZMIERZONYCH pozycji ponizej PROG_POKRYCIA=$PROG_POKRYCIA_DUBLURA." >&2
            exit 1
          fi

          set +e
          WYJSCIE_TYPOW=$(npm run sprawdz-typy -- --listFilesOnly 2>&1)
          KOD_LISTA=$?
          set -e
          if [ "$KOD_LISTA" -ne 0 ]; then
            echo "$WYJSCIE_TYPOW"
            echo "WOLAJACY SPRAWDZENIA TYPOW: listowanie plikow zakonczylo sie bledem, kod $KOD_LISTA." >&2
            exit "$KOD_LISTA"
          fi
          LICZBA_PLIKOW_TYPOW=$(echo "$WYJSCIE_TYPOW" | grep -v 'node_modules' | grep -c '\.tsx\?$' || true)
          echo "SPRAWDZ-TYPY: plikow projektu w zasiegu tsconfig.json = $LICZBA_PLIKOW_TYPOW"
          if [ "$LICZBA_PLIKOW_TYPOW" -eq 0 ]; then
            echo "WOLAJACY SPRAWDZENIA TYPOW: NIE ZMIERZONO - zero plikow projektu w zasiegu tsconfig.json (pusta, zepsuta albo podmieniona konfiguracja albo przyrzad typow)." >&2
            exit 1
          fi

          npm run sprawdz-typy
      # ZAPADKA: PROG_POKRYCIA (design-system/poligon/pomiar-styl-atomow.mjs)
      # wolno tylko PODNOSIC albo zostawic bez zmian - nigdy obnizyc bez
      # jawnej, osobnej decyzji poza tym krokiem CI. Krok czyta stala z DWOCH
      # miejsc niezaleznie: z pliku w drzewie roboczym (galaz) i z tego
      # samego pliku w commicie bazy porownania (PR: base SHA zdarzenia;
      # push: SHA sprzed pushu) - i odmawia (exit != 0), gdy wartosc w
      # galezi jest MNIEJSZA niz w bazie. Rowna przechodzi, wieksza
      # przechodzi. Domyslny checkout tego joba jest PLYTKI (brak
      # fetch-depth): krok sam dociaga pelna historie bazy przez `git fetch`
      # (nigdy reczna ingerencje w `.git/shallow` - plik granic jest tylko
      # CZYTANY). Pelnosc historii jest mierzona dla SAMEJ BAZY, nie dla
      # calego repozytorium: flaga repozytorium potrafi zostac prawdziwa
      # (plytkie) nawet gdy historia bazy jest juz kompletna, bo plik granic
      # niesie odciski z zupelnie innych pobran; a odwrotnie, flaga
      # repozytorium potrafi wygladac na pelna, gdy w istocie to wlasnie baza
      # jest ucieta. Krok czyta plik granic i dla kazdej granicy sprawdza, czy
      # lezy w historii bazy (`git merge-base --is-ancestor`); dopiero gdy
      # zadna granica nie tnie historii bazy, wolno uznac pusty
      # `git log BASE -- PLIK` za dowod, ze pliku nigdy nie bylo w historii
      # bazy - wtedy krok wprowadza zapadke i konczy sie zielono, zamiast
      # probowac odczytac plik, ktorego nigdy nie bylo. Gdy choc jedna granica
      # tnie historie bazy, ten sam pusty odczyt nie dowodzi niczego (historia
      # bazy moze byc po prostu obcieta) - krok wtedy wraca do odczytu tresci
      # pliku wprost z bazy, tak jak wtedy, gdy plik kiedys w historii bazy
      # byl, albo gdy pobranie samo w sobie zawodzi.
      - name: Zapadka progu pokrycia (PROG_POKRYCIA tylko w gore)
        working-directory: .
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          PLIK_POMIARU="frontend/design-system/poligon/pomiar-styl-atomow.mjs"
          # Brak bazy porownania (BASE_SHA pusty albo same zera - np. pchniecie
          # SWIEZEJ galezi, gdzie github.event.before to zera) NIE oznacza
          # "nie ma z czym porownac, wiec przepuscmy". Oznacza NIE ZMIERZONO:
          # zapadka nie sprawdzila, czy PROG_POKRYCIA zostal obnizony, wiec nie
          # ma prawa dac zielonego. Kod 0 tutaj byl furtka - jednym pchnieciem
          # nowej galezi z juz obnizonym progiem omijalo sie caly przyrzad.
          # Dlatego ta noga konczy sie kodem 2, nie 0: krok czerwony, dopoki
          # ktos swiadomie nie zmierzy progu wobec prawdziwej bazy. Nie
          # upraszczac tego z powrotem do exit 0.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if [ -z "$BASE_SHA" ]; then
              PRZYCZYNA_BRAKU_BAZY="pusty BASE_SHA"
            else
              PRZYCZYNA_BRAKU_BAZY="same zera w BASE_SHA"
            fi
            echo "ZAPADKA PROGU POKRYCIA: NIE ZMIERZONO - brak bazy porownania (${PRZYCZYNA_BRAKU_BAZY}, zdarzenie ${{ github.event_name }}) - krok nie przepuszcza, bo nie mial czego zmierzyc." >&2
            exit 2
          fi
          # Doganianie pelnej historii wylacznie przez `git fetch` - `--unshallow`
          # na klonie juz pelnym konczy sie bledem, a `--depth=N` na klonie juz
          # pelnym potrafi go z powrotem splycic (obie pulapki wykluczone przez
          # warunek nizej: `--unshallow` wolane TYLKO, gdy klon FAKTYCZNIE jest
          # plytki, a druga komenda nigdy nie niesie `--depth`).
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --quiet --unshallow origin 2>/dev/null
          fi
          git fetch --quiet origin "$BASE_SHA" 2>/dev/null
          # Pelnosc historii bazy liczona per baza, nie po fladze calego
          # repozytorium: czytamy plik granic (nigdy go nie zmieniamy) i dla
          # kazdej wpisanej tam granicy sprawdzamy, czy jest przodkiem bazy.
          # Granica bedaca przodkiem bazy znaczy, ze historia BAZY jest ucieta
          # w tym miejscu - wtedy baza nie ma pelnej historii, bez wzgledu na
          # to, co flaga repozytorium mowi o innych, niepowiazanych granicach.
          IS_SHALLOW_REPO="$(git rev-parse --is-shallow-repository 2>/dev/null)"
          PLIK_GRANIC="$(git rev-parse --git-path shallow 2>/dev/null)"
          GRANICE_SCIEZKA_KOD=$?
          LICZBA_GRANIC_REPO=0
          LICZBA_GRANIC_W_HISTORII_BAZY=0
          HISTORIA_BAZY_PELNA="true"
          PRZYCZYNA_GRANIC="brak sciezki granic (repozytorium nigdy nie bylo plytkie)"
          # Sama sciezka granic bywa zwodnicza: polecenie jej wyliczajace
          # potrafi zawiesc albo dac pusty wynik, sama sciezka potrafi
          # wskazywac na katalog zamiast na plik, na dowiazanie symboliczne,
          # albo na plik bez prawa odczytu - w kazdym z tych przypadkow NIE
          # WOLNO czytac tego jako "pelna historia", bo nie ma dowodu ani w
          # jedna, ani w druga strone. Dowiazanie symboliczne liczy sie jako
          # NIEPELNA niezaleznie od tego, czy jego cel istnieje: git sam
          # nigdy nie zapisuje tej sciezki jako dowiazania, wiec dowiazanie
          # tutaj jest zawsze cudzym, niezaufanym stanem. Tylko brak sciezki
          # (repozytorium nigdy plytkie) i pusty, zwykly, czytelny plik
          # (repozytorium bez zadnej biezacej granicy) licza sie jako dowod
          # pelnosci.
          if [ "$GRANICE_SCIEZKA_KOD" -ne 0 ] || [ -z "$PLIK_GRANIC" ]; then
            HISTORIA_BAZY_PELNA="false"
            PRZYCZYNA_GRANIC="rev-parse sciezki granic zawiodl albo dal pusty wynik"
          elif [ -L "$PLIK_GRANIC" ]; then
            HISTORIA_BAZY_PELNA="false"
            PRZYCZYNA_GRANIC="sciezka granic jest dowiazaniem symbolicznym, nie zwyklym plikiem zapisanym przez git"
          elif [ ! -e "$PLIK_GRANIC" ]; then
            PRZYCZYNA_GRANIC="brak sciezki granic (repozytorium nigdy nie bylo plytkie)"
          elif [ ! -f "$PLIK_GRANIC" ] || [ ! -r "$PLIK_GRANIC" ]; then
            HISTORIA_BAZY_PELNA="false"
            PRZYCZYNA_GRANIC="sciezka granic istnieje, ale nie jest zwyklym czytelnym plikiem (katalog albo brak prawa odczytu)"
          else
            GRANICE_TRESC=""
            if ! GRANICE_TRESC=$(cat < "$PLIK_GRANIC" 2>/dev/null); then
              HISTORIA_BAZY_PELNA="false"
              PRZYCZYNA_GRANIC="odczyt pliku granic zakonczyl sie bledem"
            elif [ -z "$GRANICE_TRESC" ]; then
              PRZYCZYNA_GRANIC="plik granic pusty (repozytorium bez zadnej biezacej granicy)"
            else
              PRZYCZYNA_GRANIC="plik granic odczytany, granice sprawdzone wzgledem bazy"
              while IFS= read -r GRANICA || [ -n "$GRANICA" ]; do
                [ -z "$GRANICA" ] && continue
                LICZBA_GRANIC_REPO=$((LICZBA_GRANIC_REPO + 1))
                git merge-base --is-ancestor "$GRANICA" "$BASE_SHA" 2>/dev/null
                GRANICA_KOD=$?
                if [ "$GRANICA_KOD" -eq 0 ]; then
                  LICZBA_GRANIC_W_HISTORII_BAZY=$((LICZBA_GRANIC_W_HISTORII_BAZY + 1))
                  HISTORIA_BAZY_PELNA="false"
                elif [ "$GRANICA_KOD" -ne 1 ]; then
                  HISTORIA_BAZY_PELNA="false"
                fi
              done <<< "$GRANICE_TRESC"
            fi
          fi
          echo "ZAPADKA PROGU POKRYCIA: granice w repozytorium=$LICZBA_GRANIC_REPO, granice w historii bazy=$LICZBA_GRANIC_W_HISTORII_BAZY, is-shallow-repository=$IS_SHALLOW_REPO, historia bazy pelna=$HISTORIA_BAZY_PELNA, przyczyna granic=$PRZYCZYNA_GRANIC."
          # Pelna historia bazy (zmierzona wyzej per granica) nie wystarcza sama w sobie: BASE_SHA
          # bywa skladniowo poprawny, a mimo to nieosiagalny (nigdy nie
          # istnial) albo istnieje, ale nie jest commitem (blob/drzewo z tego
          # samego repozytorium) - w obu przypadkach `git log BASE -- PLIK`
          # potrafi zakonczyc sie bledem (kod niezerowy) z PUSTYM wyjsciem,
          # co bez tej kontroli czyta sie jako "pliku nigdy nie bylo". Dlatego
          # najpierw peelowanie obiektu do commita, dopiero potem odczyt
          # historii pliku - i wynik tego odczytu liczy sie po kodzie
          # wyjscia, nigdy po samej tresci.
          if [ "$HISTORIA_BAZY_PELNA" = "true" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              echo "ZAPADKA PROGU POKRYCIA: NIE ZMIERZONO - baza $BASE_SHA nieosiagalna po pobraniu - brak dowodu nieobecnosci." >&2
              exit 1
            fi
            GIT_LOG_WYJSCIE=$(git log "$BASE_SHA" -- "$PLIK_POMIARU" 2>/dev/null)
            GIT_LOG_KOD=$?
            if [ "$GIT_LOG_KOD" -ne 0 ]; then
              echo "ZAPADKA PROGU POKRYCIA: NIE ZMIERZONO - odczyt historii $PLIK_POMIARU w bazie $BASE_SHA zakonczyl sie bledem (kod $GIT_LOG_KOD) - blad nie jest dowodem braku pliku." >&2
              exit 1
            fi
            if [ -z "$GIT_LOG_WYJSCIE" ]; then
              PROG_WPROWADZENIE=$(grep -oE 'PROG_POKRYCIA = [0-9]+' "$PLIK_POMIARU" | head -1 | grep -oE '[0-9]+')
              if [ -n "$PROG_WPROWADZENIE" ]; then
                echo "WPROWADZENIE ZAPADKI: baza $BASE_SHA bez pliku w pelnej historii, prog na czubku = $PROG_WPROWADZENIE"
                exit 0
              fi
            fi
          fi
          if ! BAZA_TRESC=$(git show "$BASE_SHA:$PLIK_POMIARU" 2>&1); then
            echo "ZAPADKA PROGU POKRYCIA: NIE ZMIERZONO - nie udalo sie odczytac $PLIK_POMIARU z bazy $BASE_SHA (fetch/show zawiodl)." >&2
            exit 1
          fi
          PROG_BAZA=$(echo "$BAZA_TRESC" | grep -oE 'PROG_POKRYCIA = [0-9]+' | head -1 | grep -oE '[0-9]+')
          PROG_GALAZ=$(grep -oE 'PROG_POKRYCIA = [0-9]+' "$PLIK_POMIARU" | head -1 | grep -oE '[0-9]+')
          if [ -z "$PROG_BAZA" ] || [ -z "$PROG_GALAZ" ]; then
            echo "ZAPADKA PROGU POKRYCIA: NIE ZMIERZONO - nie udalo sie wyluskac PROG_POKRYCIA (baza=\"$PROG_BAZA\" galaz=\"$PROG_GALAZ\")." >&2
            exit 1
          fi
          echo "ZAPADKA PROGU POKRYCIA: PROG_POKRYCIA w galezi = $PROG_GALAZ, w bazie ($BASE_SHA) = $PROG_BAZA."
          if [ "$PROG_GALAZ" -lt "$PROG_BAZA" ]; then
            echo "ZAPADKA PROGU POKRYCIA: krok czerwony - PROG_POKRYCIA obnizony z $PROG_BAZA do $PROG_GALAZ." >&2
            exit 1
          fi
          echo "ZAPADKA PROGU POKRYCIA: zielony - prog nie zostal obnizony ($PROG_GALAZ >= $PROG_BAZA)."
      # `--omit=dev` swiadomie: zmierzone
      # 6 podatnosci lacznie, z tego 2 produkcyjne - cztery zdjete flaga siedza
      # w narzedziach (vitest, js-yaml), ktore nie ida do przegladarki uzytkownika.
      # `--audit-level=high` tak samo: nizsze progi zapelnilyby log szumem,
      # w ktorym krytyczna pozycja przestaje byc widoczna.
      # Pomiar, nie blokada - z tego samego powodu co przy composer audit.
      - name: Podatności zależności npm (pomiar, nie blokada)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  skaner-statyczny:
    name: Skaner statyczny (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.169.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Reguly czytamy z KATALOGU W REPO, a nie z `--config p/...`. Powod jest
      # jeden: bramka, ktorej wynik zalezy od cudzego serwera i od tego, co ktos
      # wczoraj zmienil w regule, nie jest przyrzadem, tylko prognoza. Migawka
      # ma zapisane zrodlo, date i sumy sha256 w .semgrep/ZRODLO.md; jej
      # odswiezenie jest osobna zmiana z przegladem roznicy, nie automatem.
      # Przy okazji: `p/laravel` NIE ISTNIEJE (HTTP 404), a `p/nextjs` jest pusty
      # (`rules: []`) - zestaw pusty wchodzi na zielono i wyglada na dzialajacy
      # skaner, wiec 404 bylby tu mniejszym zlem. Nie dopisywac ich z powrotem.
      #
      # Krok JEST blokujacy od 10.09. Warunek przelaczenia byl zapisany tutaj
      # wczesniej i zostal spelniony: oba zastane trafienia z backend/config/
      # session.php sa rozstrzygniete - jedno bylo falszywe (null = ciasteczko
      # host-only, czyli wezsze, nie szersze) i nosi wyciszenie z uzasadnieniem
      # przy linii, drugie bylo prawdziwe i flaga secure ma teraz bezpieczna
      # wartosc domyslna. Zmierzone na czubku przed przelaczeniem:
      # 31 regul na 439 plikach, 0 trafien.
      #
      # Migawka nie zawiera juz zestawu generic.secrets.*: jego reguly nosza
      # przyklady sekretow w `pattern-not:` i push protection GitHuba odrzucala
      # przez nie pchniecie (GH013). Sekrety skanuje gitleaks w bramce lokalnej
      # (krok 3e) oraz push protection - nie dopisywac ich tu z powrotem.
      - name: Skan na przypietych regulach
        run: semgrep scan --config .semgrep/reguly --error --metrics=off
