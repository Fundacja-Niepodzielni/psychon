name: SonarCloud

# Skan jakosci kodu. Organizacja i projekt w SonarCloud istnieja, sekret `SONAR_TOKEN` jest
# ustawiony w repozytorium (zmierzone `gh secret list`, 16.09.2026). Przelacznik ponizej zostaje:
# bez sekretu przebieg konczy sie na zielono z pominietym krokiem skanu i nie udaje, ze cos zmierzyl.
#
# Dlaczego warunek stoi przy KROKU, a nie przy jobie:
# kontekst `secrets` nie jest dostepny w `jobs.<id>.if` (tam wolno tylko `github`, `needs`,
# `vars`, `inputs`), wiec warunek na poziomie joba albo bylby bledem wyrazenia, albo cicho
# wypadalby na false i job nie ruszylby nigdy. Sekret podstawiamy wiec do `env` joba (tam
# `secrets` jest dozwolone) i porownujemy `env` w `if` kroku — `env` w `if` kroku jest
# dozwolone. `if: env.SONAR_TOKEN != ''` pomija JEDEN krok, reszta joba idzie normalnie.
#
# Pulapka, ktorej tu swiadomie nie ma: warunek napisany jako `if: ${{ ... }} == 'x'` albo
# `if: ${{ secrets.SONAR_TOKEN }}` sklada sie do niepustego napisu, a kazdy niepusty napis
# jest w `if` prawda — taki warunek jest ZAWSZE spelniony i "wylaczenie" nie wylacza niczego.

# `sprint-*` jest tu od chwili, gdy sekret zostal zmierzony - wczesniej przebieg na galezi
# sprintu bylby zielony bez zmierzenia czegokolwiek.
on:
  push:
    branches: [main, dev, "sprint-*"]
  pull_request:

permissions:
  contents: read
  # `gh run list` (ponizej) i `actions/download-artifact` czytaja przebiegi i
  # artefakty INNEGO workflow (`ci.yml`) w tym samym repo - bez tego zawezenie
  # `contents: read` odcina rowniez odczyt Actions, bo jawna lista uprawnien
  # zastepuje domyslna, nie dodaje sie do niej.
  actions: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud (skan tylko przy ustawionym sekrecie)
    runs-on: ubuntu-latest
    # 15 -> 30: krok ponizej czeka az `ci.yml` dla TEGO SAME sha sie zakonczy
    # (do 15 minut oczekiwania), zanim skan w ogole ruszy - patrz uzasadnienie
    # przy sciezkach raportow w `sonar-project.properties`.
    timeout-minutes: 30
    env:
      # `secrets` wolno uzyc w `env` joba. Nieustawiony sekret daje pusty napis,
      # a nie blad — i to jest caly przelacznik tego workflow.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar liczy "nowy kod" z historii; plytki klon zawyza go do calego repo.
          fetch-depth: 0

      # Raporty pokrycia POWSTAJA w `ci.yml` (ten sam commit, ta sama usluga
      # Postgres/Redis, ten sam `composer install`/`npm ci`) i trafiaja tu jako
      # artefakty zamiast bycia liczonymi drugi raz w tym zadaniu - uzasadnienie
      # wyboru stoi w `sonar-project.properties`. Krok gasnie razem ze skanem:
      # bez sekretu czekanie na cudzy przebieg byloby czasem straconym na nic.
      - name: Poczekaj na przebieg CI dla tego commita
        if: env.SONAR_TOKEN != ''
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            RUN_JSON=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --json databaseId,status,conclusion --jq '.[0] // empty')
            if [ -n "$RUN_JSON" ]; then
              STATUS=$(echo "$RUN_JSON" | jq -r '.status')
              if [ "$STATUS" = "completed" ]; then
                echo "id=$(echo "$RUN_JSON" | jq -r '.databaseId')" >> "$GITHUB_OUTPUT"
                echo "conclusion=$(echo "$RUN_JSON" | jq -r '.conclusion')" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo "Przebieg ci.yml dla ${SHA} nie zakonczyl sie w limicie oczekiwania (15 min)." >&2
          exit 1

      - name: Pobierz raport pokrycia zaplecza
        if: env.SONAR_TOKEN != '' && steps.ci-run.outputs.conclusion == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pokrycie-backend
          path: backend/coverage
          run-id: ${{ steps.ci-run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Pobierz raport pokrycia frontu
        if: env.SONAR_TOKEN != '' && steps.ci-run.outputs.conclusion == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pokrycie-frontend
          path: frontend/coverage
          run-id: ${{ steps.ci-run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Skan SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Skan pominiety — brak sekretu
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN nie jest ustawiony w repozytorium."
          echo "Skan pominiety celowo. Aby go wlaczyc: zalozyc organizacje w SonarCloud,"
          echo "potwierdzic sonar.organization i sonar.projectKey w sonar-project.properties,"
          echo "dodac sekret SONAR_TOKEN w ustawieniach repozytorium."
