title = "Wyjatki skanera sekretow dla atrap w testach"

# Bazowy zestaw regul pozostaje bez zmian.
[extend]
useDefault = true

# Wyciszen POJEDYNCZYCH trafien tu NIE MA i miec nie moze. Zmierzone 16.09.2026:
# wyjatek z `paths = ['''frontend/__tests__/.*''']` gitleaks stosuje PRZED czytaniem
# tresci pliku ("DBG skipping file: global allowlist path=..."), wiec podrzucony do
# takiego pliku klucz - takze caly blok BEGIN RSA PRIVATE KEY - NIE byl znajdowany
# wcale, mimo `condition = "AND"` i mimo komentarza, ktory twierdzil co innego.
# Komentarz byl nieprawdziwy i zniknal razem z wyjatkiem.
# Falszywe trafienia wycisza teraz `.gitleaksignore` - po ODCISKU konkretnego
# znaleziska (plik + regula + linia), z powodem i data przy kazdym wpisie. Kazdy
# inny sekret w tych samych plikach jest znajdowany; sprawdzone w obie strony.

# Migawka regul Semgrepa (`.semgrep/reguly/`) to 180 KB CUDZEJ tresci, w ktorej
# reguly wykrywania sekretow zawieraja WZORCE sekretow - naglowek bloku klucza
# i przykladowy adres webhooka zlozony z samych zer. gitleaks trafia w nie
# i ma racje co do ksztaltu, a nie co do rzeczy: to nie sa sekrety, tylko opis,
# jak sekret wyglada. Zmierzone: bez tego wyjatku `leaks found: 2`.
#
# Wyjatek jest ZAWEZONY do dwoch regul, ktore realnie trafiaja. Kazda inna regula
# dziala w tych plikach normalnie - wiec klucz wklejony tam przez pomylke nadal
# zostanie zlapany, o ile nie ma akurat ksztaltu tych dwoch.
#
# Reszte pilnuje `.semgrep/ZRODLO.md`: sumy sha256 kazdego pliku. Podmiana tresci
# zmienia sume, a odswiezenie migawki jest OSOBNA runda z przegladem roznicy -
# nie automatem i nie przy okazji.
[[allowlists]]
description = "Wzorce sekretow wewnatrz przypietych regul skanera statycznego"
targetRules = ["private-key", "slack-webhook-url"]
paths = ['''\.semgrep/reguly/.*''']
