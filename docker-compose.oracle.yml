# Staging na prywatnym VPS Mikołaja.
# Korzysta z istniejącego Traefika i zewnętrznej sieci n8n_traefik.
# Uruchomienie opisuje deploy/oracle/README.md.
name: psychon-staging

x-laravel-env: &laravel-env
  APP_NAME: "Platforma Niepodzielni"
  APP_ENV: staging
  APP_KEY: ${APP_KEY:?ustaw APP_KEY w deploy/oracle/.env}
  APP_DEBUG: "false"
  APP_URL: https://${STAGING_DOMAIN:?ustaw STAGING_DOMAIN w deploy/oracle/.env}
  FRONTEND_URL: https://${STAGING_DOMAIN}
  APP_LOCALE: pl
  APP_FALLBACK_LOCALE: pl
  LOG_CHANNEL: stack
  LOG_STACK: single
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: pgsql
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-niepodzielni}
  DB_USERNAME: ${DB_USERNAME:-niepodzielni}
  DB_PASSWORD: ${DB_PASSWORD:?ustaw DB_PASSWORD w deploy/oracle/.env}
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "true"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  FILESYSTEM_DISK: local
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: platforma@niepodzielni.local
  MAIL_FROM_NAME: "Platforma Niepodzielni"

services:
  app:
    environment:
      <<: *laravel-env
      AUTORUN_ENABLED: "false"
      PHP_OPCACHE_ENABLE: "1"
    ports: !override []
    volumes:
      - ./backend:/var/www/html:z
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_traefik
      - traefik.http.routers.psychon-api.rule=Host(`${STAGING_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/storage`))
      - traefik.http.routers.psychon-api.entrypoints=websecure
      - traefik.http.routers.psychon-api.priority=200
      - traefik.http.routers.psychon-api.tls=true
      - traefik.http.routers.psychon-api.tls.certresolver=leresolver
      # API egzekwuje uprawnienia przez Laravel Sanctum; staging zawiera tylko dane demo.
      - traefik.http.routers.psychon-api.middlewares=psychon-noindex
      - traefik.http.services.psychon-api.loadbalancer.server.port=8080
    networks:
      niepodzielni: {}
      traefik: {}

  queue:
    environment:
      <<: *laravel-env
    volumes:
      - ./backend:/var/www/html:z
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    restart: unless-stopped

  scheduler:
    image: serversideup/php:8.4-fpm-nginx
    container_name: psychon_scheduler
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    volumes:
      - ./backend:/var/www/html:z
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    environment:
      <<: *laravel-env
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [niepodzielni]
    restart: unless-stopped

  pgsql:
    environment:
      POSTGRES_DB: ${DB_DATABASE:-niepodzielni}
      POSTGRES_USER: ${DB_USERNAME:-niepodzielni}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ustaw DB_PASSWORD w deploy/oracle/.env}
    ports: !override []
    restart: unless-stopped

  redis:
    restart: unless-stopped

  frontend:
    image: psychon-frontend:staging
    build:
      context: ./frontend
      dockerfile: Dockerfile.oracle
      args:
        NEXT_PUBLIC_API_URL: https://${STAGING_DOMAIN}
    container_name: psychon_frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: https://${STAGING_DOMAIN}
      NODE_ENV: production
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_traefik
      - traefik.http.routers.psychon-web.rule=Host(`${STAGING_DOMAIN}`)
      - traefik.http.routers.psychon-web.entrypoints=websecure
      - traefik.http.routers.psychon-web.priority=100
      - traefik.http.routers.psychon-web.tls=true
      - traefik.http.routers.psychon-web.tls.certresolver=leresolver
      - traefik.http.routers.psychon-web.middlewares=psychon-noindex
      - traefik.http.middlewares.psychon-noindex.headers.customresponseheaders.X-Robots-Tag=noindex,nofollow
      - traefik.http.services.psychon-web.loadbalancer.server.port=3000
    networks:
      niepodzielni: {}
      traefik: {}

  mailpit:
    ports: !override
      - "127.0.0.1:${NP_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

networks:
  traefik:
    name: n8n_traefik
    external: true

volumes:
  backend_vendor:
  backend_storage:
  backend_cache:
